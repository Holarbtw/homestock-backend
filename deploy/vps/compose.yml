name: homestock-vps

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  gateway:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      API_DOMAIN: ${API_DOMAIN:?Set API_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      auth-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 10s
      timeout: 3s
      retries: 6
    logging: *logging

  auth-service:
    image: ${IMAGE_PREFIX:?Set IMAGE_PREFIX}/auth-service:${IMAGE_TAG:?Set IMAGE_TAG}
    restart: unless-stopped
    init: true
    environment:
      AUTH_SERVICE_PORT: "8080"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${DB_USER:-homestock}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      AUTH_DB_NAME: ${AUTH_DB_NAME:-homestock_auth}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      ACCESS_TOKEN_TTL_MINUTES: ${ACCESS_TOKEN_TTL_MINUTES:-15}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-30}
      BCRYPT_COST: ${BCRYPT_COST:-10}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      start_period: 10s
      interval: 5s
      timeout: 3s
      retries: 12
    stop_grace_period: 15s
    logging: *logging

  auth-migrations:
    image: ${IMAGE_PREFIX:?Set IMAGE_PREFIX}/auth-migrations:${IMAGE_TAG:?Set IMAGE_TAG}
    profiles: ["tools"]
    restart: "no"
    environment:
      GOOSE_DBSTRING: "host=postgres port=5432 user=${DB_USER:-homestock} password=${DB_PASSWORD:?Set DB_PASSWORD} dbname=${AUTH_DB_NAME:-homestock_auth} sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy
    logging: *logging

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-homestock}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      POSTGRES_DB: ${AUTH_DB_NAME:-homestock_auth}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      # TCP avoids treating the temporary initialization server as ready.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      start_period: 10s
      interval: 5s
      timeout: 5s
      retries: 12
    logging: *logging

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
